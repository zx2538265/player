name: Notion 同步與網站發布

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 測試同步與差異比較
        run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 測試分享按鈕
        run: node --test tests/test_share_button.cjs
      - name: 讀取 Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py --output "${{ runner.temp }}/notion-preview/library.json"
      - name: 與正式網站比較
        id: compare
        run: python scripts/prepare_pages.py --catalog "${{ runner.temp }}/notion-preview/library.json" --site "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v5
        if: steps.compare.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v4
