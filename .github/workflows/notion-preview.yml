name: Notion 作品清單檢查

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-preview
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 測試同步規則
        run: python -m unittest discover -s tests -p 'test_notion_sync.py'
      - name: 讀取 Notion 並檢查清單
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py --output "${{ runner.temp }}/notion-preview/library.json"
      - name: 保存可檢視的作品清單（不部署）
        uses: actions/upload-artifact@v4
        with:
          name: notion-library-preview
          path: ${{ runner.temp }}/notion-preview/
          retention-days: 7
          if-no-files-found: error
