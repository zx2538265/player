<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中文字幕播放器｜翻譯收藏室</title>
  <script>
    if (!new URLSearchParams(window.location.search).get("v")?.trim()) {
      window.location.replace("library.html");
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111;
      color: #fff;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    body.no-scroll {
      overflow: hidden;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      --subtitle-bottom: 8%;
      --subtitle-bottom-fs: 6%;
      --fullscreen-viewport-width: 100dvw;
      --fullscreen-viewport-height: 100dvh;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }

    .library-back-link {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      margin-right: auto;
      color: #d7e6ff;
      text-decoration: none;
    }

    .library-back-link:hover,
    .library-back-link:focus-visible {
      text-decoration: underline;
    }

    .toolbar input[type="text"] {
      height: 42px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1c1c1c;
      color: #fff;
      padding: 0 12px;
      font-size: 16px;
    }

    .toolbar button,
    .toolbar input[type="file"] {
      height: 42px;
      font-size: 14px;
    }

    .toolbar button {
      border: 1px solid #3a3a3a;
      background: #252525;
      color: #fff;
      border-radius: 10px;
      padding: 0 14px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #2f2f2f;
    }

    #videoIdInput,
    #loadVideoBtn,
    #srtFileInput,
    #subtitleList {
      display: none !important;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 16px;
    }

    .player-surface { position: relative; width: 100%; height: 100%; }
    .player-wrap.is-rotated .player-surface {
      position: absolute;
      left: 50%; top: 50%;
      width: var(--fullscreen-viewport-height);
      height: var(--fullscreen-viewport-width);
      transform: translate(-50%, -50%) rotate(90deg);
    }
    .player-wrap .rotate-btn { display: none; }
    @media (any-pointer: coarse) {
      .player-wrap.is-fullscreen .rotate-btn { display: flex; }
    }

    .player-wrap:fullscreen,
    .player-wrap:-webkit-full-screen,
    .player-wrap.is-pseudo-fullscreen {
      position: fixed;
      inset: 0 auto auto 0;
      width: var(--fullscreen-viewport-width);
      height: var(--fullscreen-viewport-height);
      aspect-ratio: auto;
      border-radius: 0;
      z-index: 9999;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .subtitle-loading {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.88);
      text-align: center;
      padding: 20px;
    }

    .subtitle-loading[hidden], .subtitle-loading [hidden] { display: none; }
    .subtitle-loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #555;
      border-top-color: #d7e6ff;
      border-radius: 50%;
      animation: subtitle-loading-spin 1s linear infinite;
    }
    .subtitle-loading button {
      padding: 12px 20px;
      border: 1px solid #777;
      border-radius: 8px;
      background: #252525;
      color: #fff;
      cursor: pointer;
      font: inherit;
    }
    @keyframes subtitle-loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .subtitle-loading-spinner { animation: none; }
    }

    .player-activity-catcher {
      position: absolute;
      inset: 0;
      z-index: 29;
      display: none;
      background: transparent;
    }

    .player-wrap.side-tools-hidden .player-activity-catcher {
      display: block;
    }

    .player-wrap.is-fullscreen #player,
    .player-wrap.is-fullscreen #player iframe {
      width: 100% !important;
      height: 100% !important;
    }

    .video-content-guide {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Keep captions inside the contained video, including portrait fullscreen letterboxing. */
    .player-wrap .video-content-guide {
      inset: 50% auto auto 50%;
      width: var(--video-content-width, 100%);
      height: var(--video-content-height, 100%);
      transform: translate(-50%, -50%);
    }

    .orientation-hint {
      position: absolute;
      left: 50%;
      top: max(20px, env(safe-area-inset-top));
      z-index: 32;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.76);
      color: #fff;
      font-size: 14px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, -10px);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .orientation-hint.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      transition-delay: 0s;
    }

    .orientation-hint-icon {
      display: inline-flex;
      flex: 0 0 auto;
      width: 16px;
      height: 25px;
      border: 2px solid currentColor;
      border-radius: 4px;
    }

    .orientation-hint.is-visible .orientation-hint-icon {
      animation: orientation-hint-rotate 1.6s ease-in-out 2;
    }

    @keyframes orientation-hint-rotate {
      0%, 30% {
        transform: rotate(0deg);
      }

      70%, 100% {
        transform: rotate(90deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orientation-hint,
      .orientation-hint.is-visible {
        transition: none;
      }

      .orientation-hint.is-visible .orientation-hint-icon {
        animation: none;
        transform: rotate(90deg);
      }
    }

    .player-side-tools {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .player-wrap.side-tools-hidden .player-side-tools {
      opacity: 0;
      transform: translateY(-50%) translateX(10px);
      pointer-events: none;
    }

    .player-icon-btn {
      width: 48px;
      min-height: 52px;
      padding: 5px 2px;
      box-sizing: border-box;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 3px;
      transition: background 0.18s ease, border-color 0.18s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .player-icon-btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
    .control-label { font-size: 11px; line-height: 1.2; white-space: nowrap; }
    .fullscreen-btn .exit-icon { display: none; }
    .fullscreen-btn.is-active .enter-icon { display: none; }
    .fullscreen-btn.is-active .exit-icon { display: block; }
    .rotate-btn[aria-pressed="true"] svg { transform: rotate(-90deg); }
    .player-icon-btn:disabled { opacity: 0.5; cursor: default; }

    @media (hover: hover) and (pointer: fine) {
      .player-icon-btn:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.4);
      }
    }

    .player-icon-btn:focus-visible {
      outline: 2px solid rgba(158, 203, 255, 0.85);
      outline-offset: 2px;
    }

    .floating-subtitle-settings {
      position: absolute;
      right: 76px;
      top: 12px;
      width: min(300px, calc(100% - 96px));
      max-height: calc(var(--player-surface-height, 100dvh) - 24px);
      overflow-y: auto;
      overscroll-behavior: contain;
      box-sizing: border-box;
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
      background: rgba(24, 24, 24, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 12px;
      z-index: 31;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .floating-subtitle-settings.is-open {
      display: grid;
    }

    .settings-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .settings-heading strong { font-size: 14px; }
    .settings-close { color: #fff; background: transparent; border: 1px solid #666; border-radius: 8px; min-height: 36px; padding: 4px 12px; cursor: pointer; }

    .subtitle-layer {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: var(--subtitle-bottom);
      text-align: center;
      pointer-events: none;
    }

    .subtitle-top-layer {
      position: absolute;
      left: 6%;
      right: 6%;
      top: max(5%, env(safe-area-inset-top));
      text-align: center;
      pointer-events: none;
    }

    .subtitle-text:empty { display: none; }

    .subtitle-text {
      display: inline-block;
      max-width: 90%;
      padding: 3px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.7);

      font-size: var(--subtitle-font-size, 13px);
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      text-shadow:
        0 0 2px #000,
        0 0 4px #000,
        0 0 8px #000,
        0 0 12px #000;
    }

    .player-wrap.is-fullscreen .subtitle-layer {
      bottom: var(--subtitle-bottom-fs);
    }

    .player-wrap.is-pseudo-fullscreen .subtitle-layer {
      bottom: var(--subtitle-bottom-fs);
    }

    @media (max-width: 768px) {
      .subtitle-layer {
        left: 4%;
        right: 4%;
      }

      .subtitle-text {
        max-width: 100%;

        line-height: 1.5;
      }

      .player-wrap.is-fullscreen .subtitle-layer {
        bottom: max(var(--subtitle-bottom-fs), env(safe-area-inset-bottom));
      }

      .player-wrap.is-pseudo-fullscreen .subtitle-layer {
        bottom: max(var(--subtitle-bottom-fs), env(safe-area-inset-bottom));
      }

      .player-side-tools {
        right: 8px;
      }

      .player-icon-btn {
        width: 44px;
        min-height: 48px;
      }

      .floating-subtitle-settings {
        right: 64px;
        width: min(300px, calc(100% - 80px));
      }
    }

    .player-wrap.is-rotated .orientation-hint { display: none; }
    .player-wrap.is-rotated .player-side-tools { right: max(12px, env(safe-area-inset-bottom)); }
    .player-wrap.is-rotated .floating-subtitle-settings {
      right: max(76px, calc(env(safe-area-inset-bottom) + 64px));
      width: min(300px, calc(100% - 96px));
    }
    .video-orientation-setting { display: grid; gap: 6px; }
    .video-orientation-setting select { color: #fff; background: #252525; padding: 8px; width: 100%; }

    .subtitle-settings {
      align-items: end;
    }

    .setting-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .setting-label {
      color: #d8d8d8;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .setting-field input[type="range"] {
      width: 100%;
      accent-color: #9ecbff;
    }

    .setting-value {
      color: #9ecbff;
      font-size: 12px;
      min-height: 16px;
    }

    .setting-reset {
      height: 34px;
      border-radius: 8px;
      border: 1px solid #3b3b3b;
      background: #242424;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .setting-reset:hover {
      background: #2c2c2c;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        max-width: 100%;
      }

      .player-wrap {
        border-radius: 12px;
      }

      .toolbar {
        margin-bottom: 12px;
      }

      .list {
        margin-top: 12px;
      }

    }

    .info {
      margin-top: 16px;
      color: #bbb;
      font-size: 14px;
    }

    .list {
      margin-top: 20px;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 12px;
      max-height: 280px;
      overflow: auto;
    }

    .item {
      padding: 10px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item.active {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }

    .time {
      color: #9ecbff;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .text {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="toolbar">
      <a class="library-back-link" href="library.html">← 翻譯清單</a>
      <input id="videoIdInput" type="text" placeholder="請輸入 YouTube 影片 ID，例如 dqNMWaT9mog" />
      <button id="loadVideoBtn">載入影片</button>
      <button id="copyShareBtn" type="button" hidden>複製分享連結</button>
      <span id="shareStatus" role="status" aria-live="polite"></span>
      <input id="srtFileInput" type="file" accept=".srt" />
    </div>

    <div id="resumePrompt" hidden style="margin: 0 0 12px; padding: 12px; border: 1px solid #666; border-radius: 8px;">
      <span id="resumeMessage" role="status" aria-live="polite"></span>
      <button id="resumePlayBtn" type="button">繼續播放</button>
      <button id="restartPlayBtn" type="button">從頭播放</button>
    </div>
    <div class="player-wrap">
      <div class="player-surface">
      <div id="player"></div>
      <div id="subtitleLoading" class="subtitle-loading" hidden>
        <span id="subtitleLoadingSpinner" class="subtitle-loading-spinner" aria-hidden="true"></span>
        <span id="subtitleLoadingMessage" role="status" aria-live="polite">字幕載入中，請稍候…</span>
        <button id="retrySubtitlesBtn" type="button" hidden>重新載入字幕</button>
      </div>
      <div class="player-activity-catcher" id="playerActivityCatcher" aria-hidden="true"></div>
      <div class="video-content-guide">
        <div class="subtitle-top-layer">
          <div id="subtitleTop" class="subtitle-text"></div>
        </div>
        <div class="subtitle-layer">
          <div id="subtitle" class="subtitle-text"></div>
        </div>
      </div>
      <div id="orientationHint" class="orientation-hint" role="status" aria-live="polite" aria-hidden="true">
        <span class="orientation-hint-icon" aria-hidden="true"></span>
        <span>想橫向觀看？轉動手機，或點右側「轉橫」</span>
      </div>
      <div class="player-side-tools">
        <button id="toggleRotationBtn" class="player-icon-btn rotate-btn" type="button"
          aria-label="旋轉播放畫面" title="旋轉播放畫面" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="9" height="15" rx="2"/><path d="M10 17h1M16 3a7 7 0 0 1 5 7m0-5v5h-5"/></svg>
          <span class="control-label">轉橫</span>
        </button>
        <button id="toggleFullscreenBtn" class="player-icon-btn fullscreen-btn" type="button" aria-label="進入全螢幕"
          title="進入全螢幕">
          <svg class="enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
          <svg class="exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m13 5v-5h5"/></svg>
          <span class="control-label">放大</span>
        </button>

        <button id="toggleSubtitleSettingsBtn" class="player-icon-btn subtitle-setting-btn" type="button"
          aria-label="開啟字幕設定" aria-expanded="false" aria-controls="subtitleSettings" title="開啟字幕設定">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="M6 9h5m3 0h4M6 14h3m3 0h6"/></svg>
          <span class="control-label">字幕</span>
        </button>

        <div class="subtitle-settings floating-subtitle-settings" id="subtitleSettings">
          <div class="settings-heading"><strong>字幕設定</strong><button id="closeSubtitleSettingsBtn" class="settings-close" type="button">關閉</button></div>
          <label class="video-orientation-setting" for="videoOrientation">
            <span class="setting-label">這支影片的方向</span>
            <select id="videoOrientation">
              <option value="unknown">自動偵測</option>
              <option value="landscape">橫式</option>
              <option value="portrait">直式</option>
            </select>
            <span id="videoOrientationStatus" class="setting-label" role="status">尚未偵測</span>
          </label>
          <div class="setting-field">
            <label class="setting-label" for="subtitleScaleRange">字幕大小（占影片高度）</label>
            <input id="subtitleScaleRange" type="range" min="3" max="20" step="0.5" value="5" />
            <div class="setting-value" id="subtitleScaleValue">5%</div>
          </div>

          <div class="setting-field">
            <label class="setting-label" for="subtitleBottomRange">垂直位置（距影片底部）</label>
            <input id="subtitleBottomRange" type="range" min="0" max="60" step="1" value="8" />
            <div class="setting-value" id="subtitleBottomValue">8%</div>
          </div>

          <div class="setting-field">
            <button id="resetSubtitleSettingsBtn" type="button" class="setting-reset">
              重設目前影片比例
            </button>
          </div>
        </div>
      </div>
    </div>
    </div>
    <div class="info" id="info">尚未載入字幕</div>
    <div class="list" id="subtitleList"></div>

  </div>

  <script src="share.js"></script>
  <script src="playback-progress.js"></script>
  <script src="test-youtube-ratio.js"></script>
  <script>
    let player = null;
    const progress = createPlaybackProgress(() => player, seconds => {
      document.getElementById("resumePrompt").hidden = seconds === null;
      if (seconds !== null) {
        const total = Math.floor(seconds);
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor(total / 60) % 60;
        const time = (hours ? `${hours}:${String(minutes).padStart(2, "0")}` : String(minutes)) + `:${String(total % 60).padStart(2, "0")}`;
        document.getElementById("resumeMessage").textContent = `上次看到 ${time}`;
      }
    });
    document.getElementById("resumePlayBtn").addEventListener("click", () => progress.choose(false));
    document.getElementById("restartPlayBtn").addEventListener("click", () => progress.choose(true));
    setInterval(() => progress.save(), 5000);
    window.addEventListener("pagehide", () => progress.save());
    let syncTimer = null;
    let subtitles = [];
    let currentSubtitleIndex = -1;
    let subtitleItemElements = [];
    let subtitleSearchHintIndex = -1;
    let subtitleRequestToken = 0;
    let requestedVideoId = "";
    let isPseudoFullscreen = false;
    let rotationPreference = null;
    let videoOrientation = "unknown";
    let videoOrientationSource = "unknown";
    let videoAspectRatio = 16 / 9;
    let isPlayerPlaying = false;
    let orientationRequestToken = 0;
    const youtubeRatio = createYouTubeRatioLookup();
    let isSyncStateActive = false;
    let isSubtitleListClickBound = false;
    let controlsHideTimer = null;
    let orientationHintTimer = null;
    let wasPlayerFullscreen = false;
    let isPointerInsideSideTools = false;
    let isSideToolsKeyboardFocus = false;
    let lastSideToolsPointerType = null;
    let arePlayerSideToolsHidden = false;

    const videoIdInput = document.getElementById("videoIdInput");
    const infoEl = document.getElementById("info");
    const subtitleLoadingEl = document.getElementById("subtitleLoading");
    const subtitleLoadingSpinnerEl = document.getElementById("subtitleLoadingSpinner");
    const subtitleLoadingMessageEl = document.getElementById("subtitleLoadingMessage");
    const retrySubtitlesBtnEl = document.getElementById("retrySubtitlesBtn");
    const containerEl = document.querySelector(".container");
    const playerWrapEl = document.querySelector(".player-wrap");
    const playerSurfaceEl = document.querySelector(".player-surface");
    const toggleRotationBtnEl = document.getElementById("toggleRotationBtn");
    const videoOrientationEl = document.getElementById("videoOrientation");
    const videoOrientationStatusEl = document.getElementById("videoOrientationStatus");
    const playerSideToolsEl = document.querySelector(".player-side-tools");
    const playerActivityCatcherEl = document.getElementById("playerActivityCatcher");
    const orientationHintEl = document.getElementById("orientationHint");
    const subtitleEl = document.getElementById("subtitle");
    const subtitleTopEl = document.getElementById("subtitleTop");
    const subtitleListEl = document.getElementById("subtitleList");
    const subtitleSettingsEl = document.getElementById("subtitleSettings");
    const subtitleScaleRangeEl = document.getElementById("subtitleScaleRange");
    const subtitleBottomRangeEl = document.getElementById("subtitleBottomRange");
    const subtitleScaleValueEl = document.getElementById("subtitleScaleValue");
    const subtitleBottomValueEl = document.getElementById("subtitleBottomValue");
    const resetSubtitleSettingsBtnEl = document.getElementById("resetSubtitleSettingsBtn");
    const toggleFullscreenBtnEl = document.getElementById("toggleFullscreenBtn");
    const toggleSubtitleSettingsBtnEl = document.getElementById("toggleSubtitleSettingsBtn");
    const initialVideoId = new URLSearchParams(window.location.search).get("v")?.trim() || "";
    const subtitleSettingsStorageKey = "player-test-subtitle-ratio-prefs-v1";
    const playerControlsAutoHideDelay = 2200;
    const orientationHintDuration = 5000;

    let subtitleRatioBucket = "horizontal";
    let subtitleSettings = { fontSizePercent: 5, bottom: 8 };

    if (initialVideoId) {
      videoIdInput.value = initialVideoId;
      infoEl.textContent = `已從網址讀取影片 ID：${initialVideoId}`;
      window.updateShareVideo(initialVideoId);
    }

    function getSubtitlePreset(ratio) {
      const presets = {
        horizontal: { key: "horizontal", fontSizePercent: 5, bottom: 8 },
        "ratio-4-3": { key: "ratio-4-3", fontSizePercent: 4.5, bottom: 10 },
        square: { key: "square", fontSizePercent: 4, bottom: 14 },
        "vertical-3-4": { key: "vertical-3-4", fontSizePercent: 3.8, bottom: 16 },
        vertical: { key: "vertical", fontSizePercent: 3.5, bottom: 18 }
      };
      return presets[ratio >= 1.5 ? "horizontal" : ratio >= 1.15 ? "ratio-4-3" :
        ratio >= 0.88 ? "square" : ratio >= 0.65 ? "vertical-3-4" : "vertical"];
    }

    function readSubtitlePreferences() {
      try {
        const value = JSON.parse(localStorage.getItem(subtitleSettingsStorageKey) || "{}");
        return value && typeof value === "object" && !Array.isArray(value) ? value : {};
      } catch { return {}; }
    }

    function normalizeSubtitleSettings(raw) {
      const preset = getSubtitlePreset(videoAspectRatio);
      return {
        fontSizePercent: typeof raw?.fontSizePercent === "number" && Number.isFinite(raw.fontSizePercent) ?
          Math.min(20, Math.max(3, raw.fontSizePercent)) : preset.fontSizePercent,
        bottom: typeof raw?.bottom === "number" && Number.isFinite(raw.bottom) ?
          Math.min(60, Math.max(0, raw.bottom)) : preset.bottom
      };
    }

    function renderSubtitleSettings() {
      containerEl.style.setProperty("--subtitle-bottom", subtitleSettings.bottom + "%");
      containerEl.style.setProperty("--subtitle-bottom-fs", subtitleSettings.bottom + "%");
      subtitleScaleRangeEl.value = String(subtitleSettings.fontSizePercent);
      subtitleBottomRangeEl.value = String(subtitleSettings.bottom);
      subtitleScaleValueEl.textContent = subtitleSettings.fontSizePercent + "%";
      subtitleBottomValueEl.textContent = subtitleSettings.bottom + "%";
    }

    function applySubtitleSettings() {
      renderSubtitleSettings();
      syncPlayerContentGeometry();
    }

    function saveSubtitleSettings() {
      const preferences = readSubtitlePreferences();
      preferences[subtitleRatioBucket] = { ...subtitleSettings };
      try { localStorage.setItem(subtitleSettingsStorageKey, JSON.stringify(preferences)); } catch {}
    }

    function loadSubtitleSettings() {
      subtitleRatioBucket = getSubtitlePreset(videoAspectRatio).key;
      subtitleSettings = normalizeSubtitleSettings(readSubtitlePreferences()[subtitleRatioBucket]);
    }

    function resetCurrentRatioSettings() {
      const preferences = readSubtitlePreferences();
      delete preferences[subtitleRatioBucket];
      try { localStorage.setItem(subtitleSettingsStorageKey, JSON.stringify(preferences)); } catch {}
      subtitleSettings = normalizeSubtitleSettings(null);
      applySubtitleSettings();
    }

    function bindSubtitleSettingEvents() {
      subtitleScaleRangeEl.addEventListener("input", () => {

        applySubtitleSettings();

      subtitleBottomRangeEl.addEventListener("input", () => {

        saveSubtitleSettings();

      resetSubtitleSettingsBtnEl.addEventListener("click", resetCurrentRatioSettings);
    }

    loadSubtitleSettings();
    applySubtitleSettings();
    bindSubtitleSettingEvents();
    updateFullscreenButtonState(false);
    setSubtitleSettingsOpen(false);

    function srtTimeToSeconds(timeStr) {
      // 00:01:02,500 -> 秒
      const match = timeStr.trim().match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
      if (!match) return 0;
      const [, hh, mm, ss, ms] = match;
      return (
        parseInt(hh, 10) * 3600 +
        parseInt(mm, 10) * 60 +
        parseInt(ss, 10) +
        parseInt(ms, 10) / 1000
      );
    }

    function parseSrt(srtText, layout = null) {
      const topCaptions = new Set(Array.isArray(layout?.topCaptions)
        ? layout.topCaptions.filter(text => typeof text === "string") : []);
      // 處理 BOM
      srtText = srtText.replace(/^\uFEFF/, "");

      // 統一換行
      const normalized = srtText.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      // 每段字幕以空白行分隔
      const blocks = normalized.split(/\n{2,}/);
      const results = [];

      for (const block of blocks) {
        const lines = block.split("\n").filter(Boolean);
        if (lines.length < 2) continue;

        let index = 0;

        // 第一行可能是序號
        if (/^\d+$/.test(lines[0].trim())) {
          index = 1;
        }

        const timeLine = lines[index];
        if (!timeLine || !timeLine.includes("-->")) continue;

        const [startStr, endStr] = timeLine.split("-->").map(s => s.trim());
        const text = lines.slice(index + 1).join("\n").trim();

        if (!text) continue;

        const textLines = text.split("\n");
        const topLines = textLines.filter(line => topCaptions.has(line.trim()));
        const bottomLines = textLines.filter(line => !topCaptions.has(line.trim()));

        results.push({
          start: srtTimeToSeconds(startStr),
          end: srtTimeToSeconds(endStr),
          text,
          topText: topLines.join("\n"),
          bottomText: bottomLines.join("\n")
        });
      }

      return results;
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.round((sec - Math.floor(sec)) * 1000);

      const hh = String(h).padStart(2, "0");
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      const mmm = String(ms).padStart(3, "0");

      return `${hh}:${mm}:${ss},${mmm}`;
    }

    function findSubtitleIndexByBinarySearch(currentTime) {
      let left = 0;
      let right = subtitles.length - 1;

      while (left <= right) {
        const mid = (left + right) >> 1;
        const sub = subtitles[mid];

        if (currentTime < sub.start) {
          right = mid - 1;
        } else if (currentTime > sub.end) {
          left = mid + 1;
        } else {
          return mid;
        }
      }

      return -1;
    }

    function findSubtitleIndex(currentTime) {
      if (subtitles.length === 0) return -1;

      if (subtitleSearchHintIndex >= 0 && subtitleSearchHintIndex < subtitles.length) {
        const hinted = subtitles[subtitleSearchHintIndex];
        if (currentTime >= hinted.start && currentTime <= hinted.end) {
          return subtitleSearchHintIndex;
        }

        const nextIndex = subtitleSearchHintIndex + 1;
        if (nextIndex < subtitles.length) {
          const nextSub = subtitles[nextIndex];
          if (currentTime >= nextSub.start && currentTime <= nextSub.end) {
            return nextIndex;
          }
        }

        const prevIndex = subtitleSearchHintIndex - 1;
        if (prevIndex >= 0) {
          const prevSub = subtitles[prevIndex];
          if (currentTime >= prevSub.start && currentTime <= prevSub.end) {
            return prevIndex;
          }
        }
      }

      return findSubtitleIndexByBinarySearch(currentTime);
    }

    function renderSubtitleList() {
      syncSubtitleListClickBinding();
      subtitleListEl.innerHTML = "";
      subtitleItemElements = [];

      if (subtitles.length === 0 || !isSubtitleListVisible()) return;

      const fragment = document.createDocumentFragment();

      subtitles.forEach((sub, i) => {
        const div = document.createElement("div");
        div.className = "item" + (i === currentSubtitleIndex ? " active" : "");
        div.dataset.index = String(i);
        div.innerHTML = `
          <div class="time">${formatTime(sub.start)} --> ${formatTime(sub.end)}</div>
          <div class="text"></div>
        `;
        div.querySelector(".text").textContent = sub.text;

        subtitleItemElements.push(div);
        fragment.appendChild(div);
      });

      subtitleListEl.appendChild(fragment);
    }

    function updateActiveSubtitle(index) {
      const prevIndex = currentSubtitleIndex;
      currentSubtitleIndex = index;

      if (index >= 0) {
        subtitleEl.textContent = subtitles[index].bottomText ?? subtitles[index].text;
        subtitleTopEl.textContent = subtitles[index].topText ?? "";
      } else {
        subtitleEl.textContent = "";
        subtitleTopEl.textContent = "";
      }

      if (prevIndex >= 0 && subtitleItemElements[prevIndex]) {
        subtitleItemElements[prevIndex].classList.remove("active");
      }

      if (index >= 0 && subtitleItemElements[index]) {
        subtitleItemElements[index].classList.add("active");
      }
    }

    function syncSubtitle() {
      if (!player || typeof player.getCurrentTime !== "function" || subtitles.length === 0) return;

      const currentTime = player.getCurrentTime();
      const index = findSubtitleIndex(currentTime);

      if (index >= 0) {
        subtitleSearchHintIndex = index;
      }

      if (index !== currentSubtitleIndex) {
        updateActiveSubtitle(index);
      }
    }

    function startSyncTimer() {
      if (syncTimer || !player) return;
      syncTimer = setInterval(syncSubtitle, 150);
    }

    function stopSyncTimer() {
      if (!syncTimer) return;
      clearInterval(syncTimer);
      syncTimer = null;
    }

    function isSubtitleListVisible() {
      const style = window.getComputedStyle(subtitleListEl);
      return style.display !== "none" && style.visibility !== "hidden";
    }

    function syncSubtitleListClickBinding() {
      const shouldBind = isSubtitleListVisible();

      if (shouldBind && !isSubtitleListClickBound) {
        subtitleListEl.addEventListener("click", handleSubtitleListClick);
        isSubtitleListClickBound = true;
      } else if (!shouldBind && isSubtitleListClickBound) {
        subtitleListEl.removeEventListener("click", handleSubtitleListClick);
        isSubtitleListClickBound = false;
      }
    }

    function refreshSyncTimerState() {
      const shouldRun = isSyncStateActive && !document.hidden;

      if (shouldRun) {
        startSyncTimer();
      } else {
        stopSyncTimer();
      }
    }

    function handleVisibilityChange() {
      if (document.hidden) progress.save();
      if (!document.hidden) {
        syncSubtitle();
      }

      refreshSyncTimerState();
    }

    function handlePlayerStateChange(event) {
      const state = Number(event?.data);
      const playerState = window.YT?.PlayerState;

      const isPlaying = state === (playerState ? playerState.PLAYING : 1);
      const isBuffering = state === (playerState ? playerState.BUFFERING : 3);
      isPlayerPlaying = isPlaying;
      revealPlayerSideTools();

      if (!subtitleLoadingEl.hidden && (isPlaying || isBuffering)) {
        player.pauseVideo();
        isSyncStateActive = false;
        stopSyncTimer();
        return;
      }

      isSyncStateActive = isPlaying || isBuffering;
      progress.state(state);

      if (!isSyncStateActive) {
        syncSubtitle();
      }

      refreshSyncTimerState();
    }

    function handleSubtitleListClick(e) {
      if (!isSubtitleListVisible()) return;

      const target = e.target;
      if (!(target instanceof Element)) return;

      const itemEl = target.closest(".item");
      if (!itemEl || !subtitleListEl.contains(itemEl)) return;

      const index = Number(itemEl.dataset.index);
      if (!Number.isInteger(index) || !subtitles[index]) return;

      if (player && typeof player.seekTo === "function") {
        player.seekTo(subtitles[index].start, true);
      }
    }

    function setSubtitles(nextSubtitles) {
      subtitles = nextSubtitles;
      currentSubtitleIndex = -1;
      subtitleSearchHintIndex = subtitles.length > 0 ? 0 : -1;
      subtitleEl.textContent = "";
      subtitleTopEl.textContent = "";
      renderSubtitleList();
    }

    function getFullscreenElement() {
      return (
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement ||
        null
      );
    }

    function requestElementFullscreen(el) {
      if (!el) return;

      if (el.requestFullscreen) {
        return el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        return el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) {
        return el.msRequestFullscreen();
      }

      return Promise.reject(new Error("Fullscreen API unavailable"));
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        return document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }

      return Promise.resolve();
    }

    function syncFullscreenViewportSize() {
      const viewport = window.visualViewport;
      const width = Math.round(viewport?.width || window.innerWidth);
      const height = Math.round(viewport?.height || window.innerHeight);

      containerEl.style.setProperty("--fullscreen-viewport-width", `${width}px`);
      containerEl.style.setProperty("--fullscreen-viewport-height", `${height}px`);
    }

    function isTouchDevice() {
      return window.matchMedia("(any-pointer: coarse)").matches;
    }

    function shouldRotatePlayer({ fullscreen, touch, portrait, inApp, orientation, preference, source }) {
      return fullscreen && portrait &&
        (preference === null ? touch && inApp && orientation === "landscape" &&
          (source === "verified" || source === "manual") : preference);
    }

    function syncPlayerContentGeometry() {
      const preset = getSubtitlePreset(videoAspectRatio);
      if (subtitleRatioBucket !== preset.key) {
        loadSubtitleSettings();
        renderSubtitleSettings();
      }
      const availableWidth = playerSurfaceEl.clientWidth;
      const availableHeight = playerSurfaceEl.clientHeight;
      if (!availableWidth || !availableHeight) return;
      const width = Math.min(availableWidth, availableHeight * videoAspectRatio);
      const height = width / videoAspectRatio;
      const fontSize = Math.max(13, height * subtitleSettings.fontSizePercent / 100);
      playerWrapEl.style.setProperty("--video-content-width", `${width}px`);
      playerWrapEl.style.setProperty("--video-content-height", `${height}px`);
      playerWrapEl.style.setProperty("--subtitle-font-size", `${fontSize}px`);
      playerWrapEl.style.setProperty("--player-surface-height", `${availableHeight}px`);
    }

    function syncPlayerRotation() {
      const viewport = window.visualViewport;
      const portrait = (viewport?.height || window.innerHeight) > (viewport?.width || window.innerWidth);
      const fullscreen = isPseudoFullscreen || getFullscreenElement() === playerWrapEl;
      const inApp = /FBAN|FBAV|Instagram|Threads|Barcelona|FB_IAB|FBSS/i.test(navigator.userAgent || "");
      const rotated = shouldRotatePlayer({ fullscreen, touch: isTouchDevice(), portrait,
        inApp, orientation: videoOrientation, preference: rotationPreference, source: videoOrientationSource });
      playerWrapEl.classList.toggle("is-rotated", rotated);
      syncPlayerContentGeometry();
      syncSubtitleSettingsPlacement();
      toggleRotationBtnEl.setAttribute("aria-pressed", String(rotated));
      toggleRotationBtnEl.disabled = !portrait;
      const label = !portrait ? "手機直向時可旋轉播放畫面" : rotated ? "還原播放畫面" : "旋轉播放畫面";
      toggleRotationBtnEl.title = label;
      toggleRotationBtnEl.setAttribute("aria-label", label);
      const text = toggleRotationBtnEl.querySelector?.(".control-label");
      if (text) text.textContent = rotated ? "還原" : "轉橫";
      if (!fullscreen) rotationPreference = null;
    }

    function togglePlayerRotation() {
      if (!playerWrapEl.classList.contains("is-fullscreen")) return;
      syncFullscreenViewportSize();
      rotationPreference = !playerWrapEl.classList.contains("is-rotated");
      syncPlayerRotation();
      revealPlayerSideTools();
    }

    function loadVideoOrientation(videoId) {
      const token = ++orientationRequestToken;
      videoOrientation = "unknown";
      videoOrientationSource = "unknown";
      try {
        const stored = localStorage.getItem(`player-test-orientation:${videoId}`);
        if (stored === "portrait") {
          videoOrientation = "portrait";
          videoOrientationSource = "manual";
        } else if (stored && stored !== "landscape" && stored !== "unknown") {
          const saved = JSON.parse(stored);
          if (saved.version === 2 && ["landscape", "portrait"].includes(saved.orientation)) {
            videoOrientation = saved.orientation;
            videoOrientationSource = "manual";
          }
        }
        // Legacy landscape choices may have been made while oEmbed misclassified vertical videos.
      } catch { /* Playback remains available when storage is blocked. */ }
      videoOrientationEl.value = videoOrientation;
      videoAspectRatio = videoOrientation === "portrait" ? 9 / 16 : 16 / 9;
      rotationPreference = null;
      syncPlayerRotation();
      if (videoOrientation !== "unknown") {
        videoOrientationStatusEl.textContent = "使用手動設定";
        return;
      }
      videoOrientationStatusEl.textContent = "正在偵測影片方向…";
      youtubeRatio.get(videoId).then(result => {
        if (token !== orientationRequestToken) return;
        if (!result) {
          videoOrientationStatusEl.textContent = "無法偵測，仍可手動旋轉或指定方向";
          return;
        }
        videoOrientation = result.orientation;
        videoOrientationSource = result.source === "verified" ? "verified" : "embed";
        videoAspectRatio = result.ratio || (result.orientation === "portrait" ? 9 / 16 : result.orientation === "square" ? 1 : 16 / 9);
        const label = { landscape: "橫式", portrait: "直式", square: "方形" }[videoOrientation];
        videoOrientationStatusEl.textContent = result.source === "verified" ?
          `已確認影片比例：${label}` : `嵌入比例推估：${label}（可手動修正）`;
        syncPlayerRotation();
      });
    }

    function clearOrientationHintTimer() {
      if (!orientationHintTimer) return;
      clearTimeout(orientationHintTimer);
      orientationHintTimer = null;
    }

    function hideOrientationHint() {
      clearOrientationHintTimer();
      orientationHintEl.classList.remove("is-visible");
      orientationHintEl.setAttribute("aria-hidden", "true");
    }

    function showOrientationHintTemporarily() {
      clearOrientationHintTimer();
      orientationHintEl.classList.add("is-visible");
      orientationHintEl.setAttribute("aria-hidden", "false");

      orientationHintTimer = setTimeout(() => {
        orientationHintEl.classList.remove("is-visible");
        orientationHintEl.setAttribute("aria-hidden", "true");
        orientationHintTimer = null;
      }, orientationHintDuration);
    }

    function syncOrientationHintState(isFullscreen) {
      const viewport = window.visualViewport;
      const portrait = (viewport?.height || window.innerHeight) > (viewport?.width || window.innerWidth);
      const helpful = isFullscreen && isTouchDevice() && portrait && videoOrientation !== "portrait" &&
        !subtitleSettingsEl.classList.contains("is-open");
      if (helpful && !wasPlayerFullscreen) {
        showOrientationHintTemporarily();
      } else if (!helpful) {
        hideOrientationHint();
      }

      wasPlayerFullscreen = isFullscreen;
    }

    function enterPseudoFullscreen() {
      syncFullscreenViewportSize();
      isPseudoFullscreen = true;
      playerWrapEl.classList.add("is-pseudo-fullscreen");
      playerWrapEl.classList.add("is-fullscreen");
      document.body.classList.add("no-scroll");
      updateFullscreenButtonState(true);
      syncOrientationHintState(true);
      syncPlayerRotation();
    }

    function exitPseudoFullscreen() {
      isPseudoFullscreen = false;
      playerWrapEl.classList.remove("is-pseudo-fullscreen");
      playerWrapEl.classList.remove("is-fullscreen");
      document.body.classList.remove("no-scroll");
      updateFullscreenButtonState(false);
      syncOrientationHintState(false);
      syncPlayerRotation();
    }

    function syncPlayerFullscreenState() {
      const fullscreenEl = getFullscreenElement();
      const isPlayerFullscreen = fullscreenEl === playerWrapEl;

      if (isPseudoFullscreen) {
        syncFullscreenViewportSize();
        playerWrapEl.classList.add("is-fullscreen");
        document.body.classList.add("no-scroll");
        updateFullscreenButtonState(true);
        syncOrientationHintState(true);
        syncPlayerRotation();
        return;
      }

      if (isPlayerFullscreen) {
        syncFullscreenViewportSize();
        playerWrapEl.classList.add("is-fullscreen");
        document.body.classList.add("no-scroll");
        updateFullscreenButtonState(true);
        syncOrientationHintState(true);
      } else {
        playerWrapEl.classList.remove("is-fullscreen");
        document.body.classList.remove("no-scroll");
        updateFullscreenButtonState(false);
        syncOrientationHintState(false);
      }
      syncPlayerRotation();
    }

    // 因 YouTube iframe 內建全螢幕在跨網域文件內，外層頁面的字幕層無法覆蓋。
    // 這裡改用外層容器全螢幕，確保自訂字幕可持續顯示。
    async function togglePlayerFullscreen() {
      const fullscreenEl = getFullscreenElement();
      const isPlayerFullscreen = fullscreenEl === playerWrapEl;

      if (isPseudoFullscreen) {
        exitPseudoFullscreen();
        return;
      }

      if (isPlayerFullscreen) {
        await exitFullscreen();
      } else {
        try {
          await Promise.resolve(requestElementFullscreen(playerWrapEl));
        } catch {
          enterPseudoFullscreen();
          return;
        }
      }
    }

    function handleViewportOrientationChange() {
      syncFullscreenViewportSize();
      syncPlayerRotation();
    }

    function handleKeydown(e) {
      if (e.key === "Tab") lastSideToolsPointerType = null;
      const target = e.target;
      const isTyping = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target?.isContentEditable;

      if (!isTyping && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === "f") {
        e.preventDefault();
        togglePlayerFullscreen();
        return;
      }

      if (e.key !== "Escape") return;

      if (subtitleSettingsEl.classList.contains("is-open")) {
        setSubtitleSettingsOpen(false);
      }

      if (isPseudoFullscreen) {
        exitPseudoFullscreen();
      }
    }

    function handleDocumentClick(e) {
      if (!playerSideToolsEl.contains(e.target) && !subtitleSettingsEl.contains(e.target)) {
        setSubtitleSettingsOpen(false);
      }

      revealPlayerSideTools();
    }

    async function loadSubtitleFromSrtFolder(videoId) {
      const requestToken = ++subtitleRequestToken;
      const srtPath = `srt/${encodeURIComponent(videoId)}.srt`;
      const layoutRequest = fetch(`srt/${encodeURIComponent(videoId)}.layout.json`,
        { cache: "no-store", signal: AbortSignal.timeout(3000) })
        .then(response => response.ok ? response.json() : null)
        .catch(() => null);

      infoEl.textContent = "字幕載入中，請稍候…";

      try {
        const response = await fetch(srtPath, { cache: "no-store", signal: AbortSignal.timeout(20000) });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const text = await response.text();
        const layout = await layoutRequest;
        if (requestToken !== subtitleRequestToken) return;

        const parsedSubtitles = parseSrt(text, layout);
        if (!parsedSubtitles.length) throw new Error("Empty subtitles");
        parsedSubtitles.sort((a, b) => a.start - b.start || a.end - b.end);
        setSubtitles(parsedSubtitles);
        infoEl.textContent = `已自動載入字幕，共 ${subtitles.length} 段`;
        return true;
      } catch (err) {
        if (requestToken !== subtitleRequestToken) return;

        setSubtitles([]);
        infoEl.textContent = "字幕載入失敗，仍可播放影片。";
        return false;
      }
    }

    async function loadVideoById(videoId) {
      if (!videoId) {
        alert("請輸入 YouTube 影片 ID");
        return;
      }

      progress.detach();
      requestedVideoId = videoId;
      isPlayerPlaying = false;
      revealPlayerSideTools();
      loadVideoOrientation(videoId);
      window.updateShareVideo(videoId);
      if (player && typeof player.pauseVideo === "function") player.pauseVideo();
      subtitleLoadingEl.hidden = false;
      subtitleLoadingSpinnerEl.hidden = false;
      retrySubtitlesBtnEl.hidden = true;
      subtitleLoadingMessageEl.textContent = "字幕載入中，請稍候…";
      playerWrapEl.setAttribute("aria-busy", "true");
      // 等待字幕載入完成；即使失敗，仍繼續載入影片。
      setSubtitles([]);

      const ready = await loadSubtitleFromSrtFolder(videoId);
      if (ready === undefined) return;
      playerWrapEl.setAttribute("aria-busy", "false");
      subtitleLoadingEl.hidden = true;

      if (player && typeof player.loadVideoById === "function") {
        progress.load(videoId);

        if (typeof player.setPlaybackQuality === "function") {
          player.setPlaybackQuality("hd1080");
        }
      }

    }

    retrySubtitlesBtnEl.addEventListener("click", () => loadVideoById(requestedVideoId));

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: "",
        playerVars: {
          autoplay: 0,
          controls: 1,
          fs: 0,
          rel: 0,
          playsinline: 1,
          enablejsapi: 1,
          vq: "hd1080"
        },
        events: {
          onReady: () => {
            stopSyncTimer();
            isSyncStateActive = false;
            syncSubtitle();

            if (player && typeof player.setPlaybackQuality === "function") {
              player.setPlaybackQuality("hd1080");
            }

            if (initialVideoId) {
              loadVideoById(initialVideoId);
            }
          },
          onStateChange: handlePlayerStateChange
        }
      });
    }

    syncSubtitleListClickBinding();
    revealPlayerSideTools();

    document.getElementById("loadVideoBtn").addEventListener("click", () => {
      const videoId = videoIdInput.value.trim();
      loadVideoById(videoId);
    });

    playerWrapEl.addEventListener("mousemove", handlePlayerWrapInteraction);
    playerWrapEl.addEventListener("click", handlePlayerWrapInteraction);
    playerWrapEl.addEventListener("touchstart", handlePlayerWrapInteraction, { passive: true });
    playerActivityCatcherEl.addEventListener("mousemove", handlePlayerWrapInteraction);
    playerActivityCatcherEl.addEventListener("click", handlePlayerWrapInteraction);
    playerActivityCatcherEl.addEventListener("touchstart", handlePlayerWrapInteraction, { passive: true });
    document.addEventListener("mousemove", handleGlobalPointerActivity);
    document.addEventListener("click", handleGlobalPointerActivity);
    playerSideToolsEl.addEventListener("pointerenter", handleSideToolsPointerEnter);
    playerSideToolsEl.addEventListener("pointerleave", handleSideToolsPointerLeave);
    playerSideToolsEl.addEventListener("pointerdown", handleSideToolsPointerDown);
    playerSideToolsEl.addEventListener("focusin", handleSideToolsFocusIn);
    playerSideToolsEl.addEventListener("focusout", handleSideToolsFocusOut);

    toggleFullscreenBtnEl.addEventListener("click", togglePlayerFullscreen);
    document.getElementById("closeSubtitleSettingsBtn").addEventListener("click", () => setSubtitleSettingsOpen(false));
    toggleRotationBtnEl.addEventListener("click", togglePlayerRotation);
    videoOrientationEl.addEventListener("change", () => {
      ++orientationRequestToken;
      const selected = videoOrientationEl.value;
      try {
        localStorage.setItem(`player-test-orientation:${requestedVideoId || initialVideoId}`,
          JSON.stringify({ version: 2, orientation: selected }));
      } catch { /* The current selection still works without storage. */ }
      if (selected === "unknown") {
        loadVideoOrientation(requestedVideoId || initialVideoId);
        return;
      }
      videoOrientation = selected;
      videoOrientationSource = "manual";
      videoAspectRatio = selected === "portrait" ? 9 / 16 : 16 / 9;
      videoOrientationStatusEl.textContent = "使用手動設定";
      rotationPreference = null;
      syncPlayerRotation();
    });

    toggleSubtitleSettingsBtnEl.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleSubtitleSettingsOpen();
    });

    document.addEventListener("click", handleDocumentClick);
    document.addEventListener("visibilitychange", handleVisibilityChange);

    document.getElementById("srtFileInput").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result;
        const parsedSubtitles = parseSrt(text);
        parsedSubtitles.sort((a, b) => a.start - b.start || a.end - b.end);
        setSubtitles(parsedSubtitles);

        infoEl.textContent =
          subtitles.length > 0
            ? `已載入字幕`
            : "字幕解析失敗或沒有讀到資料";
      };

      reader.onerror = () => {
        alert("讀取字幕檔失敗");
      };

      reader.readAsText(file, "utf-8");
    });

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    document.addEventListener("fullscreenchange", syncPlayerFullscreenState);
    const playerGeometryObserver = new ResizeObserver(syncPlayerContentGeometry);
    playerGeometryObserver.observe(playerSurfaceEl);
    document.addEventListener("webkitfullscreenchange", syncPlayerFullscreenState);
    document.addEventListener("msfullscreenchange", syncPlayerFullscreenState);
    document.addEventListener("keydown", handleKeydown);
    window.addEventListener("resize", handleViewportOrientationChange);
    window.addEventListener("orientationchange", handleViewportOrientationChange);
    window.visualViewport?.addEventListener("resize", handleViewportOrientationChange);
    if (screen.orientation && typeof screen.orientation.addEventListener === "function") {
      screen.orientation.addEventListener("change", handleViewportOrientationChange);
    }

    window.addEventListener("beforeunload", () => {
      playerGeometryObserver.disconnect();
      stopSyncTimer();
      clearPlayerControlsHideTimer();
      clearOrientationHintTimer();
      document.removeEventListener("fullscreenchange", syncPlayerFullscreenState);
      document.removeEventListener("webkitfullscreenchange", syncPlayerFullscreenState);
      document.removeEventListener("msfullscreenchange", syncPlayerFullscreenState);
      document.removeEventListener("keydown", handleKeydown);
      window.removeEventListener("resize", handleViewportOrientationChange);
      window.removeEventListener("orientationchange", handleViewportOrientationChange);
      window.visualViewport?.removeEventListener("resize", handleViewportOrientationChange);
      if (screen.orientation && typeof screen.orientation.removeEventListener === "function") {
        screen.orientation.removeEventListener("change", handleViewportOrientationChange);
      }
      document.removeEventListener("click", handleDocumentClick);
      document.removeEventListener("mousemove", handleGlobalPointerActivity);
      document.removeEventListener("click", handleGlobalPointerActivity);
      document.removeEventListener("visibilitychange", handleVisibilityChange);
      playerWrapEl.removeEventListener("mousemove", handlePlayerWrapInteraction);
      playerWrapEl.removeEventListener("click", handlePlayerWrapInteraction);
      playerWrapEl.removeEventListener("touchstart", handlePlayerWrapInteraction);
      playerActivityCatcherEl.removeEventListener("mousemove", handlePlayerWrapInteraction);
      playerActivityCatcherEl.removeEventListener("click", handlePlayerWrapInteraction);
      playerActivityCatcherEl.removeEventListener("touchstart", handlePlayerWrapInteraction);
      playerSideToolsEl.removeEventListener("pointerenter", handleSideToolsPointerEnter);
      playerSideToolsEl.removeEventListener("pointerleave", handleSideToolsPointerLeave);
      playerSideToolsEl.removeEventListener("pointerdown", handleSideToolsPointerDown);
      playerSideToolsEl.removeEventListener("focusin", handleSideToolsFocusIn);
      playerSideToolsEl.removeEventListener("focusout", handleSideToolsFocusOut);
      subtitleListEl.removeEventListener("click", handleSubtitleListClick);
      isSubtitleListClickBound = false;
    });
  </script>
</body>

</html>
