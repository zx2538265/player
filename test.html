<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影片撥放器</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111;
      color: #fff;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    body.no-scroll {
      overflow: hidden;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      --subtitle-scale: 1;
      --subtitle-bottom: 8%;
      --subtitle-bottom-fs: 6%;
      --fullscreen-viewport-width: 100dvw;
      --fullscreen-viewport-height: 100dvh;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }

    .toolbar input[type="text"] {
      height: 42px;
      border: 1px solid #444;
      border-radius: 10px;
      background: #1c1c1c;
      color: #fff;
      padding: 0 12px;
      font-size: 16px;
    }

    .toolbar button,
    .toolbar input[type="file"] {
      height: 42px;
      font-size: 14px;
    }

    .toolbar button {
      border: 1px solid #3a3a3a;
      background: #252525;
      color: #fff;
      border-radius: 10px;
      padding: 0 14px;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #2f2f2f;
    }

    #videoIdInput,
    #loadVideoBtn,
    #srtFileInput,
    #subtitleList {
      display: none !important;
    }

    .player-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      border-radius: 16px;
    }

    .player-wrap:fullscreen,
    .player-wrap:-webkit-full-screen,
    .player-wrap.is-pseudo-fullscreen {
      position: fixed;
      inset: 0 auto auto 0;
      width: var(--fullscreen-viewport-width);
      height: var(--fullscreen-viewport-height);
      aspect-ratio: auto;
      border-radius: 0;
      z-index: 9999;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    .player-activity-catcher {
      position: absolute;
      inset: 0;
      z-index: 29;
      display: none;
      background: transparent;
    }

    .player-wrap.side-tools-hidden .player-activity-catcher {
      display: block;
    }

    .player-wrap.is-fullscreen #player,
    .player-wrap.is-fullscreen #player iframe {
      width: 100% !important;
      height: 100% !important;
    }

    .video-content-guide {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* 橫向全螢幕以 16:9 guide 定位字幕，避免字幕落到影片上下黑邊。 */
    .player-wrap.is-fullscreen .video-content-guide {
      inset: 50% auto auto 50%;
      width: min(100%, calc(var(--fullscreen-viewport-height) * 16 / 9));
      height: min(100%, calc(var(--fullscreen-viewport-width) * 9 / 16));
      transform: translate(-50%, -50%);
    }

    /* 手機保持直向放大時，讓直式影片與字幕共用完整的直向畫面。 */
    @media (max-width: 1024px) and (orientation: portrait) {
      .player-wrap.is-fullscreen .video-content-guide {
        inset: 0;
        width: 100%;
        height: 100%;
        transform: none;
      }
    }

    .player-side-tools {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      pointer-events: auto;
      opacity: 1;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .player-wrap.side-tools-hidden .player-side-tools {
      opacity: 0;
      transform: translateY(-50%) translateX(10px);
      pointer-events: none;
    }

    .player-icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s ease, border-color 0.18s ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .fullscreen-btn::before {
      content: "⤢";
      font-size: 18px;
      line-height: 1;
    }

    .fullscreen-btn.is-active::before {
      content: "⤡";
    }

    .subtitle-setting-btn::before {
      content: "⚙";
      font-size: 17px;
      line-height: 1;
    }

    .player-icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .player-icon-btn:focus-visible {
      outline: 2px solid rgba(158, 203, 255, 0.85);
      outline-offset: 2px;
    }

    .floating-subtitle-settings {
      position: absolute;
      right: 48px;
      top: 50%;
      transform: translateY(-50%);
      width: 260px;
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
      background: rgba(24, 24, 24, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 12px;
      z-index: 31;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    .floating-subtitle-settings.is-open {
      display: grid;
    }

    .subtitle-layer {
      position: absolute;
      left: 6%;
      right: 6%;
      bottom: var(--subtitle-bottom);
      text-align: center;
      pointer-events: none;
    }

    .subtitle-text {
      display: inline-block;
      max-width: 90%;
      padding: 3px 14px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.7);
      font-size: calc(clamp(24px, 1.9vw, 32px) * var(--subtitle-scale));
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      text-shadow:
        0 0 2px #000,
        0 0 4px #000,
        0 0 8px #000,
        0 0 12px #000;
    }

    .player-wrap.is-fullscreen .subtitle-layer {
      bottom: var(--subtitle-bottom-fs);
    }

    .player-wrap.is-pseudo-fullscreen .subtitle-layer {
      bottom: var(--subtitle-bottom-fs);
    }

    .player-wrap.is-fullscreen .subtitle-text {
      font-size: calc(clamp(24px, 1.9vh + 0.6vw, 46px) * var(--subtitle-scale));
    }

    .player-wrap.is-pseudo-fullscreen .subtitle-text {
      font-size: calc(clamp(24px, 1.9vh + 0.6vw, 46px) * var(--subtitle-scale));
    }

    @media (max-width: 1024px) {
      .subtitle-text {
        font-size: calc(clamp(20px, 2.8vw, 28px) * var(--subtitle-scale));
      }
    }

    @media (max-width: 768px) {
      .subtitle-layer {
        left: 4%;
        right: 4%;
      }

      .subtitle-text {
        max-width: 100%;
        font-size: calc(clamp(15px, 3.8vw, 24px) * var(--subtitle-scale));
        line-height: 1.5;
      }

      .player-wrap.is-fullscreen .subtitle-layer {
        bottom: max(var(--subtitle-bottom-fs), env(safe-area-inset-bottom));
      }

      .player-wrap.is-pseudo-fullscreen .subtitle-layer {
        bottom: max(var(--subtitle-bottom-fs), env(safe-area-inset-bottom));
      }

      .player-wrap.is-fullscreen .subtitle-text {
        font-size: calc(clamp(15px, 3.8vw, 24px) * var(--subtitle-scale));
      }

      .player-wrap.is-pseudo-fullscreen .subtitle-text {
        font-size: calc(clamp(15px, 3.8vw, 24px) * var(--subtitle-scale));
      }

      .player-side-tools {
        right: 8px;
      }

      .player-icon-btn {
        width: 36px;
        height: 36px;
      }

      .floating-subtitle-settings {
        right: 44px;
        width: min(240px, calc(100vw - 72px));
      }
    }

    .subtitle-settings {
      align-items: end;
    }

    .setting-field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .setting-label {
      color: #d8d8d8;
      font-size: 12px;
      letter-spacing: 0.2px;
    }

    .setting-field input[type="range"] {
      width: 100%;
      accent-color: #9ecbff;
    }

    .setting-value {
      color: #9ecbff;
      font-size: 12px;
      min-height: 16px;
    }

    .setting-reset {
      height: 34px;
      border-radius: 8px;
      border: 1px solid #3b3b3b;
      background: #242424;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .setting-reset:hover {
      background: #2c2c2c;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .container {
        max-width: 100%;
      }

      .player-wrap {
        border-radius: 12px;
      }

      .toolbar {
        margin-bottom: 12px;
      }

      .list {
        margin-top: 12px;
      }

      .notion-link-wrap {
        margin-top: 16px;
      }
    }

    .info {
      margin-top: 16px;
      color: #bbb;
      font-size: 14px;
    }

    .list {
      margin-top: 20px;
      background: #1a1a1a;
      border-radius: 12px;
      padding: 12px;
      max-height: 280px;
      overflow: auto;
    }

    .notion-link-wrap {
      margin-top: 24px;
      text-align: center;
    }

    .notion-link {
      color: #9ecbff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .notion-link:hover,
    .notion-link:focus-visible {
      text-decoration: underline;
    }

    .item {
      padding: 10px;
      border-bottom: 1px solid #2a2a2a;
      cursor: pointer;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item.active {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }

    .time {
      color: #9ecbff;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .text {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="toolbar">
      <input id="videoIdInput" type="text" placeholder="請輸入 YouTube 影片 ID，例如 dqNMWaT9mog" />
      <button id="loadVideoBtn">載入影片</button>
      <input id="srtFileInput" type="file" accept=".srt" />
    </div>
    <div class="info" id="info">尚未載入字幕</div>
    <div class="list" id="subtitleList"></div>
    <div class="player-wrap">
      <div id="player"></div>
      <div class="player-activity-catcher" id="playerActivityCatcher" aria-hidden="true"></div>
      <div class="video-content-guide">
        <div class="subtitle-layer">
          <div id="subtitle" class="subtitle-text"></div>
        </div>
      </div>
      <div class="player-side-tools">
        <button id="toggleFullscreenBtn" class="player-icon-btn fullscreen-btn" type="button" aria-label="進入全螢幕"
          title="進入全螢幕"></button>

        <button id="toggleSubtitleSettingsBtn" class="player-icon-btn subtitle-setting-btn" type="button"
          aria-label="開啟字幕設定" aria-expanded="false" title="開啟字幕設定"></button>

        <div class="subtitle-settings floating-subtitle-settings" id="subtitleSettings">
          <div class="setting-field">
            <label class="setting-label" for="subtitleScaleRange">字幕大小</label>
            <input id="subtitleScaleRange" type="range" min="80" max="160" step="1" value="100" />
            <div class="setting-value" id="subtitleScaleValue">100%</div>
          </div>

          <div class="setting-field">
            <label class="setting-label" for="subtitleBottomRange">一般位置（底部）</label>
            <input id="subtitleBottomRange" type="range" min="2" max="20" step="1" value="8" />
            <div class="setting-value" id="subtitleBottomValue">8%</div>
          </div>

          <div class="setting-field">
            <button id="resetSubtitleSettingsBtn" type="button" class="setting-reset">
              重設字幕設定
            </button>
          </div>
        </div>
      </div>
    </div>


    <div class="notion-link-wrap">
      <a
        class="notion-link"
        href="https://allenkaka.notion.site/358f1640416380ce9943cb914b0409f1?v=372f16404163804c947b000c5be27931"
        target="_blank"
        rel="noopener noreferrer"
      >更多翻譯影片 請點這裡</a>
    </div>
  </div>

  <script>
    let player = null;
    let syncTimer = null;
    let subtitles = [];
    let currentSubtitleIndex = -1;
    let subtitleItemElements = [];
    let subtitleSearchHintIndex = -1;
    let subtitleRequestToken = 0;
    let isPseudoFullscreen = false;
    let isSyncStateActive = false;
    let isSubtitleListClickBound = false;
    let controlsHideTimer = null;
    let isPointerInsideSideTools = false;
    let arePlayerSideToolsHidden = false;

    const videoIdInput = document.getElementById("videoIdInput");
    const infoEl = document.getElementById("info");
    const containerEl = document.querySelector(".container");
    const playerWrapEl = document.querySelector(".player-wrap");
    const playerSideToolsEl = document.querySelector(".player-side-tools");
    const playerActivityCatcherEl = document.getElementById("playerActivityCatcher");
    const subtitleEl = document.getElementById("subtitle");
    const subtitleListEl = document.getElementById("subtitleList");
    const subtitleSettingsEl = document.getElementById("subtitleSettings");
    const subtitleScaleRangeEl = document.getElementById("subtitleScaleRange");
    const subtitleBottomRangeEl = document.getElementById("subtitleBottomRange");
    const subtitleBottomFsRangeEl = document.getElementById("subtitleBottomFsRange");
    const subtitleScaleValueEl = document.getElementById("subtitleScaleValue");
    const subtitleBottomValueEl = document.getElementById("subtitleBottomValue");
    const subtitleBottomFsValueEl = document.getElementById("subtitleBottomFsValue");
    const resetSubtitleSettingsBtnEl = document.getElementById("resetSubtitleSettingsBtn");
    const toggleFullscreenBtnEl = document.getElementById("toggleFullscreenBtn");
    const toggleSubtitleSettingsBtnEl = document.getElementById("toggleSubtitleSettingsBtn");
    const initialVideoId = new URLSearchParams(window.location.search).get("v")?.trim() || "";
    const subtitleSettingsStorageKey = "yt-srt-subtitle-settings";
    const playerControlsAutoHideDelay = 2200;

    const defaultSubtitleSettings = {
      scale: 80,
      bottom: 8,
      bottomFs: 6
    };

    let subtitleSettings = { ...defaultSubtitleSettings };

    if (initialVideoId) {
      videoIdInput.value = initialVideoId;
      infoEl.textContent = `已從網址讀取影片 ID：${initialVideoId}`;
    }

    function updateFullscreenButtonState(isFullscreen) {
      const label = isFullscreen ? "離開全螢幕" : "進入全螢幕";
      toggleFullscreenBtnEl.classList.toggle("is-active", isFullscreen);
      toggleFullscreenBtnEl.setAttribute("aria-label", label);
      toggleFullscreenBtnEl.setAttribute("title", label);
    }

    function setSubtitleSettingsOpen(isOpen) {
      const label = isOpen ? "關閉字幕設定" : "開啟字幕設定";
      subtitleSettingsEl.classList.toggle("is-open", isOpen);
      toggleSubtitleSettingsBtnEl.setAttribute("aria-expanded", isOpen ? "true" : "false");
      toggleSubtitleSettingsBtnEl.setAttribute("aria-label", label);
      toggleSubtitleSettingsBtnEl.setAttribute("title", label);

      if (isOpen) {
        revealPlayerSideTools();
        clearPlayerControlsHideTimer();
      } else {
        schedulePlayerSideToolsAutoHide();
      }
    }

    function toggleSubtitleSettingsOpen() {
      const isOpen = subtitleSettingsEl.classList.contains("is-open");
      setSubtitleSettingsOpen(!isOpen);
    }

    function setPlayerSideToolsHidden(hidden) {
      if (arePlayerSideToolsHidden === hidden) return;
      arePlayerSideToolsHidden = hidden;
      playerWrapEl.classList.toggle("side-tools-hidden", hidden);
    }

    function clearPlayerControlsHideTimer() {
      if (!controlsHideTimer) return;
      clearTimeout(controlsHideTimer);
      controlsHideTimer = null;
    }

    function schedulePlayerSideToolsAutoHide() {
      clearPlayerControlsHideTimer();

      if (subtitleSettingsEl.classList.contains("is-open") || isPointerInsideSideTools) {
        return;
      }

      controlsHideTimer = setTimeout(() => {
        setPlayerSideToolsHidden(true);
      }, playerControlsAutoHideDelay);
    }

    function revealPlayerSideTools() {
      setPlayerSideToolsHidden(false);
      schedulePlayerSideToolsAutoHide();
    }

    function handlePlayerWrapInteraction(e) {
      if (!(e.target instanceof Element)) {
        revealPlayerSideTools();
        return;
      }

      if (e.target.closest(".floating-subtitle-settings")) {
        return;
      }

      revealPlayerSideTools();
    }

    function handleSideToolsMouseEnter() {
      isPointerInsideSideTools = true;
      clearPlayerControlsHideTimer();
      setPlayerSideToolsHidden(false);
    }

    function handleSideToolsMouseLeave() {
      isPointerInsideSideTools = false;
      schedulePlayerSideToolsAutoHide();
    }

    function handleSideToolsFocusIn() {
      clearPlayerControlsHideTimer();
      setPlayerSideToolsHidden(false);
    }

    function handleSideToolsFocusOut(e) {
      if (playerSideToolsEl.contains(e.relatedTarget)) return;
      schedulePlayerSideToolsAutoHide();
    }

    function handleGlobalPointerActivity() {
      revealPlayerSideTools();
    }

    function normalizeSubtitleSettings(raw) {
      const scale = Number(raw?.scale);
      const bottom = Number(raw?.bottom);
      const bottomFs = Number(raw?.bottomFs);

      return {
        scale: Number.isFinite(scale) ? Math.min(160, Math.max(80, Math.round(scale))) : defaultSubtitleSettings.scale,
        bottom: Number.isFinite(bottom) ? Math.min(20, Math.max(2, Math.round(bottom))) : defaultSubtitleSettings.bottom,
        bottomFs: Number.isFinite(bottomFs) ? Math.min(20, Math.max(2, Math.round(bottomFs))) : defaultSubtitleSettings.bottomFs
      };
    }

    function applySubtitleSettings() {
      const fullscreenBottom = subtitleBottomFsRangeEl ? subtitleSettings.bottomFs : subtitleSettings.bottom;

      containerEl.style.setProperty("--subtitle-scale", (subtitleSettings.scale / 100).toString());
      containerEl.style.setProperty("--subtitle-bottom", `${subtitleSettings.bottom}%`);
      containerEl.style.setProperty("--subtitle-bottom-fs", `${fullscreenBottom}%`);

      subtitleScaleRangeEl.value = String(subtitleSettings.scale);
      subtitleBottomRangeEl.value = String(subtitleSettings.bottom);
      if (subtitleBottomFsRangeEl) {
        subtitleBottomFsRangeEl.value = String(subtitleSettings.bottomFs);
      }

      subtitleScaleValueEl.textContent = `${subtitleSettings.scale}%`;
      subtitleBottomValueEl.textContent = `${subtitleSettings.bottom}%`;
      if (subtitleBottomFsValueEl) {
        subtitleBottomFsValueEl.textContent = `${subtitleSettings.bottomFs}%`;
      }
    }

    function saveSubtitleSettings() {
      localStorage.setItem(subtitleSettingsStorageKey, JSON.stringify(subtitleSettings));
    }

    function loadSubtitleSettings() {
      try {
        const raw = localStorage.getItem(subtitleSettingsStorageKey);
        if (!raw) return;
        subtitleSettings = normalizeSubtitleSettings(JSON.parse(raw));
      } catch (err) {
        subtitleSettings = { ...defaultSubtitleSettings };
      }
    }

    function bindSubtitleSettingEvents() {
      subtitleScaleRangeEl.addEventListener("input", () => {
        subtitleSettings.scale = Number(subtitleScaleRangeEl.value);
        applySubtitleSettings();
        saveSubtitleSettings();
      });

      subtitleBottomRangeEl.addEventListener("input", () => {
        subtitleSettings.bottom = Number(subtitleBottomRangeEl.value);
        applySubtitleSettings();
        saveSubtitleSettings();
      });

      if (subtitleBottomFsRangeEl) {
        subtitleBottomFsRangeEl.addEventListener("input", () => {
          subtitleSettings.bottomFs = Number(subtitleBottomFsRangeEl.value);
          applySubtitleSettings();
          saveSubtitleSettings();
        });
      }

      resetSubtitleSettingsBtnEl.addEventListener("click", () => {
        subtitleSettings = { ...defaultSubtitleSettings };
        applySubtitleSettings();
        saveSubtitleSettings();
      });
    }

    loadSubtitleSettings();
    applySubtitleSettings();
    bindSubtitleSettingEvents();
    updateFullscreenButtonState(false);
    setSubtitleSettingsOpen(false);

    function srtTimeToSeconds(timeStr) {
      // 00:01:02,500 -> 秒
      const match = timeStr.trim().match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
      if (!match) return 0;
      const [, hh, mm, ss, ms] = match;
      return (
        parseInt(hh, 10) * 3600 +
        parseInt(mm, 10) * 60 +
        parseInt(ss, 10) +
        parseInt(ms, 10) / 1000
      );
    }

    function parseSrt(srtText) {
      // 處理 BOM
      srtText = srtText.replace(/^\uFEFF/, "");

      // 統一換行
      const normalized = srtText.replace(/\r\n/g, "\n").replace(/\r/g, "\n");

      // 每段字幕以空白行分隔
      const blocks = normalized.split(/\n{2,}/);
      const results = [];

      for (const block of blocks) {
        const lines = block.split("\n").filter(Boolean);
        if (lines.length < 2) continue;

        let index = 0;

        // 第一行可能是序號
        if (/^\d+$/.test(lines[0].trim())) {
          index = 1;
        }

        const timeLine = lines[index];
        if (!timeLine || !timeLine.includes("-->")) continue;

        const [startStr, endStr] = timeLine.split("-->").map(s => s.trim());
        const text = lines.slice(index + 1).join("\n").trim();

        if (!text) continue;

        results.push({
          start: srtTimeToSeconds(startStr),
          end: srtTimeToSeconds(endStr),
          text
        });
      }

      return results;
    }

    function formatTime(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.round((sec - Math.floor(sec)) * 1000);

      const hh = String(h).padStart(2, "0");
      const mm = String(m).padStart(2, "0");
      const ss = String(s).padStart(2, "0");
      const mmm = String(ms).padStart(3, "0");

      return `${hh}:${mm}:${ss},${mmm}`;
    }

    function findSubtitleIndexByBinarySearch(currentTime) {
      let left = 0;
      let right = subtitles.length - 1;

      while (left <= right) {
        const mid = (left + right) >> 1;
        const sub = subtitles[mid];

        if (currentTime < sub.start) {
          right = mid - 1;
        } else if (currentTime > sub.end) {
          left = mid + 1;
        } else {
          return mid;
        }
      }

      return -1;
    }

    function findSubtitleIndex(currentTime) {
      if (subtitles.length === 0) return -1;

      if (subtitleSearchHintIndex >= 0 && subtitleSearchHintIndex < subtitles.length) {
        const hinted = subtitles[subtitleSearchHintIndex];
        if (currentTime >= hinted.start && currentTime <= hinted.end) {
          return subtitleSearchHintIndex;
        }

        const nextIndex = subtitleSearchHintIndex + 1;
        if (nextIndex < subtitles.length) {
          const nextSub = subtitles[nextIndex];
          if (currentTime >= nextSub.start && currentTime <= nextSub.end) {
            return nextIndex;
          }
        }

        const prevIndex = subtitleSearchHintIndex - 1;
        if (prevIndex >= 0) {
          const prevSub = subtitles[prevIndex];
          if (currentTime >= prevSub.start && currentTime <= prevSub.end) {
            return prevIndex;
          }
        }
      }

      return findSubtitleIndexByBinarySearch(currentTime);
    }

    function renderSubtitleList() {
      syncSubtitleListClickBinding();
      subtitleListEl.innerHTML = "";
      subtitleItemElements = [];

      if (subtitles.length === 0 || !isSubtitleListVisible()) return;

      const fragment = document.createDocumentFragment();

      subtitles.forEach((sub, i) => {
        const div = document.createElement("div");
        div.className = "item" + (i === currentSubtitleIndex ? " active" : "");
        div.dataset.index = String(i);
        div.innerHTML = `
          <div class="time">${formatTime(sub.start)} --> ${formatTime(sub.end)}</div>
          <div class="text"></div>
        `;
        div.querySelector(".text").textContent = sub.text;

        subtitleItemElements.push(div);
        fragment.appendChild(div);
      });

      subtitleListEl.appendChild(fragment);
    }

    function updateActiveSubtitle(index) {
      const prevIndex = currentSubtitleIndex;
      currentSubtitleIndex = index;

      if (index >= 0) {
        subtitleEl.textContent = subtitles[index].text;
      } else {
        subtitleEl.textContent = "";
      }

      if (prevIndex >= 0 && subtitleItemElements[prevIndex]) {
        subtitleItemElements[prevIndex].classList.remove("active");
      }

      if (index >= 0 && subtitleItemElements[index]) {
        subtitleItemElements[index].classList.add("active");
      }
    }

    function syncSubtitle() {
      if (!player || typeof player.getCurrentTime !== "function" || subtitles.length === 0) return;

      const currentTime = player.getCurrentTime();
      const index = findSubtitleIndex(currentTime);

      if (index >= 0) {
        subtitleSearchHintIndex = index;
      }

      if (index !== currentSubtitleIndex) {
        updateActiveSubtitle(index);
      }
    }

    function startSyncTimer() {
      if (syncTimer || !player) return;
      syncTimer = setInterval(syncSubtitle, 150);
    }

    function stopSyncTimer() {
      if (!syncTimer) return;
      clearInterval(syncTimer);
      syncTimer = null;
    }

    function isSubtitleListVisible() {
      const style = window.getComputedStyle(subtitleListEl);
      return style.display !== "none" && style.visibility !== "hidden";
    }

    function syncSubtitleListClickBinding() {
      const shouldBind = isSubtitleListVisible();

      if (shouldBind && !isSubtitleListClickBound) {
        subtitleListEl.addEventListener("click", handleSubtitleListClick);
        isSubtitleListClickBound = true;
      } else if (!shouldBind && isSubtitleListClickBound) {
        subtitleListEl.removeEventListener("click", handleSubtitleListClick);
        isSubtitleListClickBound = false;
      }
    }

    function refreshSyncTimerState() {
      const shouldRun = isSyncStateActive && !document.hidden;

      if (shouldRun) {
        startSyncTimer();
      } else {
        stopSyncTimer();
      }
    }

    function handleVisibilityChange() {
      if (!document.hidden) {
        syncSubtitle();
      }

      refreshSyncTimerState();
    }

    function handlePlayerStateChange(event) {
      const state = Number(event?.data);
      const playerState = window.YT?.PlayerState;

      const isPlaying = state === (playerState ? playerState.PLAYING : 1);
      const isBuffering = state === (playerState ? playerState.BUFFERING : 3);

      isSyncStateActive = isPlaying || isBuffering;

      if (!isSyncStateActive) {
        syncSubtitle();
      }

      refreshSyncTimerState();
    }

    function handleSubtitleListClick(e) {
      if (!isSubtitleListVisible()) return;

      const target = e.target;
      if (!(target instanceof Element)) return;

      const itemEl = target.closest(".item");
      if (!itemEl || !subtitleListEl.contains(itemEl)) return;

      const index = Number(itemEl.dataset.index);
      if (!Number.isInteger(index) || !subtitles[index]) return;

      if (player && typeof player.seekTo === "function") {
        player.seekTo(subtitles[index].start, true);
      }
    }

    function setSubtitles(nextSubtitles) {
      subtitles = nextSubtitles;
      currentSubtitleIndex = -1;
      subtitleSearchHintIndex = subtitles.length > 0 ? 0 : -1;
      subtitleEl.textContent = "";
      renderSubtitleList();
    }

    function getFullscreenElement() {
      return (
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement ||
        null
      );
    }

    function requestElementFullscreen(el) {
      if (!el) return;

      if (el.requestFullscreen) {
        return el.requestFullscreen();
      } else if (el.webkitRequestFullscreen) {
        return el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) {
        return el.msRequestFullscreen();
      }

      return Promise.reject(new Error("Fullscreen API unavailable"));
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        return document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        return document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        return document.msExitFullscreen();
      }

      return Promise.resolve();
    }

    function syncFullscreenViewportSize() {
      const viewport = window.visualViewport;
      const width = Math.round(viewport?.width || window.innerWidth);
      const height = Math.round(viewport?.height || window.innerHeight);

      containerEl.style.setProperty("--fullscreen-viewport-width", `${width}px`);
      containerEl.style.setProperty("--fullscreen-viewport-height", `${height}px`);
    }

    function enterPseudoFullscreen() {
      syncFullscreenViewportSize();
      isPseudoFullscreen = true;
      playerWrapEl.classList.add("is-pseudo-fullscreen");
      playerWrapEl.classList.add("is-fullscreen");
      document.body.classList.add("no-scroll");
      updateFullscreenButtonState(true);
    }

    function exitPseudoFullscreen() {
      isPseudoFullscreen = false;
      playerWrapEl.classList.remove("is-pseudo-fullscreen");
      playerWrapEl.classList.remove("is-fullscreen");
      document.body.classList.remove("no-scroll");
      updateFullscreenButtonState(false);
    }

    function syncPlayerFullscreenState() {
      const fullscreenEl = getFullscreenElement();
      const isPlayerFullscreen = fullscreenEl === playerWrapEl;

      if (isPseudoFullscreen) {
        syncFullscreenViewportSize();
        playerWrapEl.classList.add("is-fullscreen");
        document.body.classList.add("no-scroll");
        updateFullscreenButtonState(true);
        return;
      }

      if (isPlayerFullscreen) {
        syncFullscreenViewportSize();
        playerWrapEl.classList.add("is-fullscreen");
        document.body.classList.add("no-scroll");
        updateFullscreenButtonState(true);
      } else {
        playerWrapEl.classList.remove("is-fullscreen");
        document.body.classList.remove("no-scroll");
        updateFullscreenButtonState(false);
      }
    }

    // 因 YouTube iframe 內建全螢幕在跨網域文件內，外層頁面的字幕層無法覆蓋。
    // 這裡改用外層容器全螢幕，確保自訂字幕可持續顯示。
    async function togglePlayerFullscreen() {
      const fullscreenEl = getFullscreenElement();
      const isPlayerFullscreen = fullscreenEl === playerWrapEl;

      if (isPseudoFullscreen) {
        exitPseudoFullscreen();
        return;
      }

      if (isPlayerFullscreen) {
        await exitFullscreen();
      } else {
        try {
          await Promise.resolve(requestElementFullscreen(playerWrapEl));
        } catch {
          enterPseudoFullscreen();
          return;
        }
      }
    }

    function handleViewportOrientationChange() {
      syncFullscreenViewportSize();
    }

    function handleKeydown(e) {
      const target = e.target;
      const isTyping = target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement || target?.isContentEditable;

      if (!isTyping && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === "f") {
        e.preventDefault();
        togglePlayerFullscreen();
        return;
      }

      if (e.key !== "Escape") return;

      if (subtitleSettingsEl.classList.contains("is-open")) {
        setSubtitleSettingsOpen(false);
      }

      if (isPseudoFullscreen) {
        exitPseudoFullscreen();
      }
    }

    function handleDocumentClick(e) {
      if (!playerSideToolsEl.contains(e.target)) {
        setSubtitleSettingsOpen(false);
      }

      revealPlayerSideTools();
    }

    async function loadSubtitleFromSrtFolder(videoId) {
      const requestToken = ++subtitleRequestToken;
      const srtPath = `srt/${encodeURIComponent(videoId)}.srt`;

      infoEl.textContent = `嘗試載入字幕：${srtPath}`;

      try {
        const response = await fetch(srtPath, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const text = await response.text();
        if (requestToken !== subtitleRequestToken) return;

        const parsedSubtitles = parseSrt(text);
        parsedSubtitles.sort((a, b) => a.start - b.start || a.end - b.end);
        setSubtitles(parsedSubtitles);
        infoEl.textContent =
          subtitles.length > 0
            ? `已自動載入字幕，共 ${subtitles.length} 段`
            : `已讀取 ，但解析不到字幕內容`;
      } catch (err) {
        if (requestToken !== subtitleRequestToken) return;

        setSubtitles([]);
        infoEl.textContent = `找不到對應字幕檔：${srtPath}`;
      }
    }

    function loadVideoById(videoId) {
      if (!videoId) {
        alert("請輸入 YouTube 影片 ID");
        return;
      }

      // 切換影片時先清空舊字幕，避免等待新字幕期間持續進行舊資料比對。
      setSubtitles([]);

      if (player && typeof player.loadVideoById === "function") {
        player.loadVideoById({
          videoId,
          suggestedQuality: "hd1080"
        });

        if (typeof player.setPlaybackQuality === "function") {
          player.setPlaybackQuality("hd1080");
        }
      }

      loadSubtitleFromSrtFolder(videoId);
    }

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        videoId: "",
        playerVars: {
          autoplay: 0,
          controls: 1,
          fs: 0,
          rel: 0,
          playsinline: 1,
          enablejsapi: 1,
          vq: "hd1080"
        },
        events: {
          onReady: () => {
            stopSyncTimer();
            isSyncStateActive = false;
            syncSubtitle();

            if (player && typeof player.setPlaybackQuality === "function") {
              player.setPlaybackQuality("hd1080");
            }

            if (initialVideoId) {
              loadVideoById(initialVideoId);
            }
          },
          onStateChange: handlePlayerStateChange
        }
      });
    }

    syncSubtitleListClickBinding();
    revealPlayerSideTools();

    document.getElementById("loadVideoBtn").addEventListener("click", () => {
      const videoId = videoIdInput.value.trim();
      loadVideoById(videoId);
    });

    playerWrapEl.addEventListener("mousemove", handlePlayerWrapInteraction);
    playerWrapEl.addEventListener("click", handlePlayerWrapInteraction);
    playerWrapEl.addEventListener("touchstart", handlePlayerWrapInteraction, { passive: true });
    playerActivityCatcherEl.addEventListener("mousemove", handlePlayerWrapInteraction);
    playerActivityCatcherEl.addEventListener("click", handlePlayerWrapInteraction);
    playerActivityCatcherEl.addEventListener("touchstart", handlePlayerWrapInteraction, { passive: true });
    document.addEventListener("mousemove", handleGlobalPointerActivity);
    document.addEventListener("click", handleGlobalPointerActivity);
    playerSideToolsEl.addEventListener("mouseenter", handleSideToolsMouseEnter);
    playerSideToolsEl.addEventListener("mouseleave", handleSideToolsMouseLeave);
    playerSideToolsEl.addEventListener("focusin", handleSideToolsFocusIn);
    playerSideToolsEl.addEventListener("focusout", handleSideToolsFocusOut);

    toggleFullscreenBtnEl.addEventListener("click", togglePlayerFullscreen);

    toggleSubtitleSettingsBtnEl.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleSubtitleSettingsOpen();
    });

    document.addEventListener("click", handleDocumentClick);
    document.addEventListener("visibilitychange", handleVisibilityChange);

    document.getElementById("srtFileInput").addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const text = reader.result;
        const parsedSubtitles = parseSrt(text);
        parsedSubtitles.sort((a, b) => a.start - b.start || a.end - b.end);
        setSubtitles(parsedSubtitles);

        infoEl.textContent =
          subtitles.length > 0
            ? `已載入字幕，共 ${subtitles.length} 段`
            : "字幕解析失敗或沒有讀到資料";
      };

      reader.onerror = () => {
        alert("讀取字幕檔失敗");
      };

      reader.readAsText(file, "utf-8");
    });

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    document.addEventListener("fullscreenchange", syncPlayerFullscreenState);
    document.addEventListener("webkitfullscreenchange", syncPlayerFullscreenState);
    document.addEventListener("msfullscreenchange", syncPlayerFullscreenState);
    document.addEventListener("keydown", handleKeydown);
    window.addEventListener("resize", handleViewportOrientationChange);
    window.addEventListener("orientationchange", handleViewportOrientationChange);
    window.visualViewport?.addEventListener("resize", handleViewportOrientationChange);
    if (screen.orientation && typeof screen.orientation.addEventListener === "function") {
      screen.orientation.addEventListener("change", handleViewportOrientationChange);
    }

    window.addEventListener("beforeunload", () => {
      stopSyncTimer();
      clearPlayerControlsHideTimer();
      document.removeEventListener("fullscreenchange", syncPlayerFullscreenState);
      document.removeEventListener("webkitfullscreenchange", syncPlayerFullscreenState);
      document.removeEventListener("msfullscreenchange", syncPlayerFullscreenState);
      document.removeEventListener("keydown", handleKeydown);
      window.removeEventListener("resize", handleViewportOrientationChange);
      window.removeEventListener("orientationchange", handleViewportOrientationChange);
      window.visualViewport?.removeEventListener("resize", handleViewportOrientationChange);
      if (screen.orientation && typeof screen.orientation.removeEventListener === "function") {
        screen.orientation.removeEventListener("change", handleViewportOrientationChange);
      }
      document.removeEventListener("click", handleDocumentClick);
      document.removeEventListener("mousemove", handleGlobalPointerActivity);
      document.removeEventListener("click", handleGlobalPointerActivity);
      document.removeEventListener("visibilitychange", handleVisibilityChange);
      playerWrapEl.removeEventListener("mousemove", handlePlayerWrapInteraction);
      playerWrapEl.removeEventListener("click", handlePlayerWrapInteraction);
      playerWrapEl.removeEventListener("touchstart", handlePlayerWrapInteraction);
      playerActivityCatcherEl.removeEventListener("mousemove", handlePlayerWrapInteraction);
      playerActivityCatcherEl.removeEventListener("click", handlePlayerWrapInteraction);
      playerActivityCatcherEl.removeEventListener("touchstart", handlePlayerWrapInteraction);
      playerSideToolsEl.removeEventListener("mouseenter", handleSideToolsMouseEnter);
      playerSideToolsEl.removeEventListener("mouseleave", handleSideToolsMouseLeave);
      playerSideToolsEl.removeEventListener("focusin", handleSideToolsFocusIn);
      playerSideToolsEl.removeEventListener("focusout", handleSideToolsFocusOut);
      subtitleListEl.removeEventListener("click", handleSubtitleListClick);
      isSubtitleListClickBound = false;
    });
  </script>
</body>

</html>
